services:
  # PostgreSQL Database
  - type: pserv
    name: feedback-intelligence-db
    ipAddress: false
    plan: free
    region: oregon
    postgresSQLVersion: 15
    
  # Backend API (FastAPI)
  - type: web
    name: feedback-intelligence-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-intelligence-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: $FRONTEND_URL
      - key: API_TITLE
        value: "Feedback Intelligence API"
      - key: API_DESCRIPTION
        value: "AI-Powered Product Feedback Analysis Platform"
    autoDeploy: true
    
  # Frontend (Next.js)
  - type: web
    name: feedback-intelligence-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: feedback-intelligence-api
          property: renderURL
      - key: NODE_ENV
        value: production
    autoDeploy: true

envVarGroups:
  - name: secrets
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
